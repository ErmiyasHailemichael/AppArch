events {}

http {
    log_format lb '$remote_addr -> upstream $upstream_addr "$request" status=$status';
    access_log /dev/stdout lb;

    # Round-robin is the default algorithm. Service names come from Docker DNS.
    upstream backend_pool {
        server backend1:5000 max_fails=2 fail_timeout=10s;
        server backend2:5000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Health endpoint of the load balancer itself
        location = /lb-health {
            access_log off;
            return 200 "load balancer ok\n";
        }

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Failover: if a backend is down or slow, retry on the other one
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
